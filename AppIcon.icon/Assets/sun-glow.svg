<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <!-- Sun radial gradient matching app: center highlight (1,0.973,0.851) to edge (1,0.851,0.553) -->
    <radialGradient id="sunGrad" cx="36%" cy="34%" r="50%">
      <stop offset="0%" stop-color="#fff8d9"/>
      <stop offset="100%" stop-color="#ffd98d"/>
    </radialGradient>
    <!-- Outer glow -->
    <radialGradient id="sunGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#ffce75" stop-opacity="0.75"/>
      <stop offset="60%" stop-color="#ffce75" stop-opacity="0.3"/>
      <stop offset="100%" stop-color="#ffce75" stop-opacity="0"/>
    </radialGradient>
    <filter id="blur" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="20"/>
    </filter>
  </defs>
  <!-- Glow halo -->
  <circle cx="256" cy="256" r="200" fill="url(#sunGlow)" filter="url(#blur)"/>
  <!-- Main sun body -->
  <circle cx="256" cy="256" r="128" fill="url(#sunGrad)"/>
  <!-- Subtle border ring -->
  <circle cx="256" cy="256" r="128" fill="none" stroke="#ffd98d" stroke-opacity="0.3" stroke-width="4"/>
</svg>
